# Enable at least these modules before using this vhost:
#   a2enmod proxy proxy_http proxy_balancer lbmethod_byrequests headers

# The instances this package runs, as the nginx template lists them: `postinst` creates the `prod` stage
# and `phis@prod.service` serves it on 5301; a further instance of the same stage gets its own port and
# its own member. Another stage is a different installation with its own database and its own vhost.
#
# `ttl` is the reason this is a balancer and not a bare ProxyPass: mod_proxy keeps backend connections
# open, and one it hands out after Node closed its side answers a POST -- a login, a publish -- with 502.
# Node closes an idle keep-alive connection after 5 s, so the pool must let go earlier. See phis-host
# README.md, "Web server in front of several instances".
<Proxy balancer://phis>
  BalancerMember http://127.0.0.1:5301 ttl=4
  #BalancerMember http://127.0.0.1:5302 ttl=4
</Proxy>

<VirtualHost *:80>
  ServerName api.example.invalid

  # The original Host reaches the runtime with its port, which the form relay compares against the
  # browser's Referer.
  ProxyPreserveHost On
  ProxyPass / balancer://phis/
  ProxyPassReverse / balancer://phis/
  RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
