# Installed by the package as /etc/nginx/sites-available/phis.conf; link it from sites-enabled/ and
# adjust server_name. Debian includes sites-enabled/* in nginx's http context, which is where `map` and
# `upstream` are allowed -- this file must not be included inside a `server` block.

# `Connection` for the proxied request: empty for an ordinary one, so the pooled upstream connection
# survives it, and `upgrade` only when the browser asked for one. A constant "upgrade" would close every
# pooled connection after a single request.
map $http_upgrade $phis_connection {
  default upgrade;
  ""      "";
}

# The instances this package runs. `postinst` creates the `prod` stage and `phis@prod.service` serves it
# on 5301; a further instance of the same stage gets its own port and its own line here, and belongs in
# this pool because both processes answer for one installation.
#
# Another stage (`phis@stage.service`, PHIS_ROOT=/srv/phis/stages/stage) is a different installation with
# its own database. It gets an `upstream` of its own under another name and its own `server` block, never
# a line in this one -- and it reuses the `map` above, which may be declared only once per `http` context.
upstream phis {
  server 127.0.0.1:5301;
  #server 127.0.0.1:5302;
  keepalive 64;
  # Below Node's keep-alive timeout of 5 s. The other way round nginx sends a request down a connection
  # Node has just closed: a GET is retried on the next instance, a POST -- a login, a publish -- fails
  # with 502. See phis-host README.md, "Web server in front of several instances".
  keepalive_timeout 4s;
}

server {
  listen 80;
  server_name api.example.invalid;

  location / {
    proxy_pass http://phis;
    proxy_http_version 1.1;
    # `$http_host` rather than `$host`: on a port other than 80 or 443 `$host` drops the port that the
    # browser's `Referer` keeps, and the form relay compares the two and refuses every submit.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $phis_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
